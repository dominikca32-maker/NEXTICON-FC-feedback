name: Feature request
description: An idea or a missing feature / Idee oder fehlende Funktion
title: "[Feature]: "
labels: ["enhancement", "closed-beta"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the idea. Deutsch, English or Español.

        No patch or code required. This board is for product wishes, not pull requests.
  - type: textarea
    id: idea
    attributes:
      label: Idea / Idee
      description: What should the game do that it does not do today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / Warum
      description: What problem does this solve while playing?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Bereich
      options:
        - Career simulation
        - Hub / slots / Hall of Fame
        - UI / layout / accessibility
        - Account / ranking / sync
        - Guides / onboarding
        - Other
    validations:
      required: true
  - type: dropdown
    id: importance
    attributes:
      label: How important for you / Wie wichtig
      options:
        - Nice to have
        - Would play more with this
        - Blocking for me
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra / Sonstiges
      description: Examples, references, sketches. No source patches here.
