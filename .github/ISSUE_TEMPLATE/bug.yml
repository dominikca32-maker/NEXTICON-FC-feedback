name: Bug
description: Something is broken or behaves wrongly / Etwas läuft falsch
title: "[Bug]: "
labels: ["bug", "closed-beta"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the bug. Deutsch, English or Español.

        Attach a **screenshot** and the **save JSON** if the app offered a download.
        Screenshot und Save-JSON anhängen, sobald die App sie herunterlädt.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened / Was passiert
      description: What did you see? Include error text if any.
      placeholder: z. B. Nach dem Winterfenster bleibt die Saison-Simulation hängen.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / Erwartet
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / Schritte
      description: Numbered steps from the hub or from a loaded career.
      placeholder: |
        1. Hub → Continue
        2. Transfer window → accept offer
        3. …
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Screen / Bildschirm
      options:
        - Hub / Home
        - Setup / Spieler erstellen
        - Career / laufende Karriere
        - Career end / Karriereende
        - Account / Settings
        - Ranking / Hall of Fame
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From the app or about `1.3.x`. Staging vs production if you know it.
      placeholder: "1.3.0 / production or staging"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language / Sprache
      options:
        - de
        - en
        - es
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device / Browser und Gerät
      placeholder: "Chrome 128, Windows 11 / Safari iPhone"
    validations:
      required: true
  - type: checkboxes
    id: attachments
    attributes:
      label: Attachments / Anhänge
      description: GitHub cannot take files from the app URL. Upload them on this issue after you submit, or drag them onto this form.
      options:
        - label: Screenshot attached (or I will add it after submit)
        - label: Save JSON attached (optional; career state)
        - label: I do not want to attach a save
  - type: textarea
    id: extra
    attributes:
      label: Extra / Sonstiges
      description: Console errors, slot number, theme. No passwords, no Google account data.
